log_format joomla_tsv escape=default
    '$time_iso8601\t$remote_addr\t$request_method\t$request_uri\t'
    '$status\t$body_bytes_sent\t$request_time\t$http_user_agent\t'
    '$connection\t$connection_requests';

server {
    listen 80;

    proxy_http_version 1.1;
    proxy_set_header Host              $http_host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }

    location /jupyter/ {
        proxy_pass http://jupyter:8888;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 86400s;
    }

    location /grafana/ {
        proxy_pass http://grafana:3000;
    }

    location / {
        proxy_pass http://joomla:80;
        access_log /var/log/nginx/joomla/access.tsv joomla_tsv;
        access_log /var/log/nginx/access.log;
    }
}