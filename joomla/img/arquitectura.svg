<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" font-family="Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker>
    <marker id="v" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a5a00"/></marker>
  </defs>
  <rect width="1000" height="660" fill="#ffffff"/>

  <!-- host -->
  <rect x="330" y="15" width="340" height="60" rx="8" fill="#eeeeee" stroke="#555"/>
  <text x="500" y="40" text-anchor="middle" font-size="15" font-weight="700">Host · navegador</text>
  <text x="500" y="61" text-anchor="middle" font-size="12">localhost:80 → DNAT hacia nginx</text>

  <!-- redes -->
  <rect x="20" y="100" width="960" height="235" fill="#e7f1fb" stroke="#4a7fb5"/>
  <text x="968" y="122" text-anchor="end" font-size="13" font-weight="700" fill="#2c5f93">frontend_net · bridge · 172.30.10.0/24 (gateway .1)</text>
  <rect x="20" y="335" width="960" height="255" fill="#eef7ea" stroke="#4f8a3c"/>
  <text x="968" y="578" text-anchor="end" font-size="13" font-weight="700" fill="#3d6e2e">backend_net · bridge · internal: true · 172.30.20.0/24 (sin salida a internet)</text>

  <!-- nginx -->
  <rect x="370" y="135" width="260" height="72" rx="8" fill="#fff" stroke="#1f3b5c" stroke-width="2"/>
  <text x="500" y="160" text-anchor="middle" font-size="15" font-weight="700" fill="#1f3b5c">nginx</text>
  <text x="500" y="178" text-anchor="middle" font-size="12">nginx:alpine · TCP 80</text>
  <text x="500" y="195" text-anchor="middle" font-size="12">172.30.10.5 · único puerto publicado</text>

  <!-- apps (doble red) -->
  <g font-size="12" text-anchor="middle">
    <rect x="70" y="265" width="210" height="115" rx="8" fill="#fff" stroke="#1f3b5c" stroke-width="2"/>
    <text x="175" y="292" font-size="15" font-weight="700" fill="#1f3b5c">joomla</text>
    <text x="175" y="310">joomla:6-apache · TCP 80</text>
    <text x="175" y="335" fill="#2c5f93">eth0 172.30.10.4</text>
    <text x="175" y="355" fill="#3d6e2e">eth1 172.30.20.5</text>

    <rect x="395" y="265" width="210" height="115" rx="8" fill="#fff" stroke="#1f3b5c" stroke-width="2"/>
    <text x="500" y="292" font-size="15" font-weight="700" fill="#1f3b5c">jupyter</text>
    <text x="500" y="310">minimal-notebook · TCP 8888</text>
    <text x="500" y="327">base_url /jupyter/</text>
    <text x="500" y="345" fill="#2c5f93">eth0 172.30.10.3</text>
    <text x="500" y="363" fill="#3d6e2e">eth1 172.30.20.4</text>

    <rect x="720" y="265" width="210" height="115" rx="8" fill="#fff" stroke="#1f3b5c" stroke-width="2"/>
    <text x="825" y="292" font-size="15" font-weight="700" fill="#1f3b5c">grafana</text>
    <text x="825" y="310">grafana/grafana · TCP 3000</text>
    <text x="825" y="327">sub-ruta /grafana/</text>
    <text x="825" y="345" fill="#2c5f93">eth0 172.30.10.2</text>
    <text x="825" y="363" fill="#3d6e2e">eth1 172.30.20.3</text>

    <rect x="400" y="465" width="200" height="80" rx="8" fill="#fff" stroke="#1f3b5c" stroke-width="2"/>
    <text x="500" y="490" font-size="15" font-weight="700" fill="#1f3b5c">database</text>
    <text x="500" y="508">postgres:16-alpine · TCP 5432</text>
    <text x="500" y="526" fill="#3d6e2e">172.30.20.2 · pg_data + file_fdw</text>
  </g>

  <!-- volumen de logs -->
  <rect x="760" y="465" width="190" height="60" rx="8" fill="#fff7e6" stroke="#8a5a00" stroke-dasharray="6 4"/>
  <text x="855" y="490" text-anchor="middle" font-size="12" fill="#8a5a00">volumen nginx_logs</text>
  <text x="855" y="508" text-anchor="middle" font-size="12" fill="#8a5a00">access.tsv</text>

  <!-- tráfico -->
  <g stroke="#333" stroke-width="1.8" fill="none" marker-end="url(#a)">
    <path d="M500,75 L500,133"/>
    <path d="M370,190 L282,272"/>
    <path d="M500,207 L500,263"/>
    <path d="M630,190 L718,272"/>
    <path d="M230,380 L420,463"/>
    <path d="M500,380 L500,463"/>
    <path d="M780,380 L582,463"/>
  </g>
  <g font-size="12" fill="#222">
    <text x="508" y="100">HTTP · TCP 80</text>
    <text x="235" y="225">/  → joomla:80</text>
    <text x="508" y="243">/jupyter/ · HTTP + WebSocket</text>
    <text x="668" y="225">/grafana/ → :3000</text>
    <text x="232" y="440">pgsql · TCP 5432</text>
    <text x="508" y="428">psycopg2</text>
    <text x="640" y="412">SQL · TCP 5432</text>
  </g>

  <!-- flujo de logs -->
  <g stroke="#8a5a00" stroke-width="1.6" fill="none" stroke-dasharray="6 4" marker-end="url(#v)">
    <path d="M630,155 L955,155 L955,463"/>
    <path d="M760,500 L602,500"/>
  </g>
  <text x="700" y="148" font-size="12" fill="#8a5a00">escribe access.tsv (solo tráfico a Joomla)</text>
  <text x="640" y="545" font-size="12" fill="#8a5a00">file_fdw (lectura)</text>

  <!-- dns -->
  <rect x="250" y="605" width="500" height="45" rx="8" fill="#fdf2f2" stroke="#b34747"/>
  <text x="500" y="624" text-anchor="middle" font-size="14" font-weight="700" fill="#8f2f2f">DNS embebido de Docker · 127.0.0.11</text>
  <text x="500" y="642" text-anchor="middle" font-size="12">resuelve nombres de servicio solo dentro de cada red</text>
</svg>
